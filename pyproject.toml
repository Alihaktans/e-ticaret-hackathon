[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "trendyol-relevance"
version = "0.1.0"
description = "Trendyol e-commerce query-product relevance experiments"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    "joblib>=1.3",
    "numpy>=1.24",
    "pandas>=2.0",
    "polars>=0.20",
    "pyarrow>=14",
    "rapidfuzz>=3.6",
    "scikit-learn>=1.3",
    "scipy>=1.10",
    "tqdm>=4.66",
]

[project.optional-dependencies]
ml = [
    "catboost>=1.2",
    "matplotlib>=3.8",
]
nlp = [
    "datasets>=2.18",
    "sentence-transformers>=2.6",
    "torch>=2.1",
    "transformers>=4.39",
]
dev = [
    "pytest>=8",
    "ruff>=0.5",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 120
